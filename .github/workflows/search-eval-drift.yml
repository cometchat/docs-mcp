name: Search eval drift

# Runs the search ranking eval (scripts/eval-search.ts) against cometchat/docs
# main once a day. CI's blocking search-eval job pins the docs commit in
# .github/eval-docs-commit, so a docs change can never fail a pull request;
# this job reports when docs main has drifted from what the cases expect. It
# gates nothing.
#   exit 2  grounding drift: a case names a page main no longer has (a move
#           or rename). Update the case and bump the pin together.
#   exit 1  ranking drift: on main's docs some check fails that passes on the
#           pinned commit. Fix the ranking or the case, then bump the pin.
#   exit 3  the index could not be scored (not built, or an older schema):
#           a job problem, not drift.
#
# A red scheduled run notifies nobody, so drift also opens an issue labelled
# search-eval-drift, appends to it on later days while the drift persists,
# and closes it on the first clean run. That is the one write this workflow
# makes; it still needs no secret beyond the job token. The file syncs to the
# public mirror (ci.yml and DEPLOY.md name it), so the job runs only in the
# private repository: the mirror has nobody to act on the issue.

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  eval-docs-main:
    if: github.repository == 'cometchat-team/docs-mcp'
    runs-on: ubuntu-latest
    # ci.yml's search-eval runs the same three steps in 15; the extra is
    # headroom for the unpinned clone. Without a bound a hung clone would burn
    # the 360-minute default every night.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: cometchat-mcp

      # Blobless and sparse, as the Dockerfile's indexer stage clones it: the
      # top-level files (docs.json), every .mdx page, and the .md files a page
      # may import as a snippet (src/search/mdx-imports.ts takes either
      # extension).
      - uses: actions/checkout@v5
        with:
          repository: cometchat/docs
          path: cometchat-docs
          ref: main
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            **/*.mdx
            **/*.md
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: cometchat-mcp/package-lock.json

      - name: Install
        working-directory: cometchat-mcp
        run: npm ci

      - name: Build search index
        working-directory: cometchat-mcp
        env:
          DOCS_REPO: ${{ github.workspace }}/cometchat-docs
          INDEX_PATH: ${{ github.workspace }}/search-eval/index.sqlite
        run: npm run build:index

      - name: Score search ranking against docs main
        id: score
        working-directory: cometchat-mcp
        shell: bash
        env:
          DOCS_REPO: ${{ github.workspace }}/cometchat-docs
          INDEX_PATH: ${{ github.workspace }}/search-eval/index.sqlite
        run: |
          pinned=$(tr -d '[:space:]' < .github/eval-docs-commit)
          head=$(git -C "$DOCS_REPO" rev-parse HEAD)
          code=0
          npm run --silent eval:search > eval.log 2>&1 || code=$?
          # The same report feeds the job summary and the drift issue.
          {
            echo "## Search eval on cometchat/docs main"
            echo
            echo "Docs main is \`$head\`; the eval is pinned to \`$pinned\`."
            echo
            case $code in
              0) echo "No drift: $(tail -n 1 eval.log)" ;;
              1) echo "Ranking drift: some checks fail on docs main." ;;
              2) echo "Grounding drift: some cases name pages docs main no longer has." ;;
              3) echo "The index could not be scored (exit 3): a job problem, not drift." ;;
              *) echo "The eval did not run (exit $code)." ;;
            esac
            echo
            echo '```'
            # Each failing check under its case, grounding problems, the tally.
            awk '/^## /{c=$0} /^   FAIL/{if(c){print c; c=""} print} /^Golden expectations/{g=1} g||/checks passed/' eval.log
            echo '```'
          } > "$RUNNER_TEMP/drift.md"
          cat "$RUNNER_TEMP/drift.md" >> "$GITHUB_STEP_SUMMARY"
          cat eval.log
          {
            echo "code=$code"
            echo "head=$head"
            echo "pinned=$pinned"
          } >> "$GITHUB_OUTPUT"
          case $code in
            0) ;;
            1) echo "::error::search ranking drift on docs main ($head): see the job summary" ;;
            2) echo "::error::search eval grounding drift on docs main ($head): see the job summary" ;;
            3) echo "::error::the search eval could not score the index (exit 3): see the job summary" ;;
            *) echo "::error::the search eval failed to run (exit $code)" ;;
          esac
          exit $code

      # Runs whether the score step passed or failed, but only when it produced
      # a drift verdict: a checkout or install failure, or an unscorable
      # index, is a job problem and gets no issue.
      - name: Open, update or close the drift issue
        if: always() && (steps.score.outputs.code == '0' || steps.score.outputs.code == '1' || steps.score.outputs.code == '2')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODE: ${{ steps.score.outputs.code }}
          HEAD: ${{ steps.score.outputs.head }}
          PINNED: ${{ steps.score.outputs.pinned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: search-eval-drift
        run: |
          set -euo pipefail
          gh label create "$LABEL" --description "The daily search eval fails on docs main" --color D93F0B 2>/dev/null || true
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          {
            cat "$RUNNER_TEMP/drift.md"
            echo
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/issue.md"
          case "$CODE" in
            0)
              if [ -n "$open" ]; then
                gh issue close "$open" --comment "Clean run against docs main \`$HEAD\` (pinned \`$PINNED\`): no drift. $RUN_URL"
                echo "closed #$open"
              else
                echo "no drift, no open issue"
              fi
              ;;
            *)
              if [ -n "$open" ]; then
                gh issue comment "$open" --body-file "$RUNNER_TEMP/issue.md"
                echo "appended to #$open"
              else
                kind=$([ "$CODE" = 2 ] && echo "grounding" || echo "ranking")
                gh issue create --title "Search eval: $kind drift on docs main" --label "$LABEL" --body-file "$RUNNER_TEMP/issue.md"
              fi
              ;;
          esac
